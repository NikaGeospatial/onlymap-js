<!DOCTYPE html>
<!--
  Measure example (spec: issue #20 — geodesic distance & area).

  The <om-widget type="measure"> panel measures on the map: pick Distance or
  Area, then click to place points. Live per-segment and running-total labels
  render on the map (a double-click or Enter closes the shape, Esc cancels),
  and the panel shows the total plus a metric/imperial/nautical units toggle.

  Distance is haversine on the WGS84 mean sphere; area is the spherical-excess
  integral — both pure geodesy (src/geodesy.ts, src/units.ts), the same units
  module the scale-bar below now runs on. Capture reuses the draw stack, so the
  geometry is ephemeral: never saved, never an undo step. Read the value in
  code from the `om-measure` event on <om-map>.
-->
<html>
<head>
  <meta charset="utf-8" />
  <title>OnlyMapJS — Measure</title>
  <script type="module" src="https://unpkg.com/@nika-js/onlymap@0.5.10/dist/onlymap.standalone.js"></script>
  <link rel="stylesheet" href="nav.css" />
</head>
<body>

  <header class="nav">
    <strong>OnlyMapJS examples</strong>
    <a href="index.html">Overview</a>
    <a href="draw.html">Draw</a>
    <a href="measure.html" class="current">Measure</a>
  </header>

  <om-map center="[-98.35, 39.5]" zoom="4" basemap="positron" map-id="measure-example">
    <!-- Pick Distance or Area, then click the map. -->
    <om-widget type="measure" modes="distance area" units="metric" position="top-start"></om-widget>
    <!-- Shares the units module with measure. -->
    <om-widget type="scale-bar" units="metric" position="bottom-start"></om-widget>
  </om-map>

</body>
</html>
