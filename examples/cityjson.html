<!DOCTYPE html>
<!--
  CityJSON example (spec: "CityJSON ingestion") — a real 3DBAG tile
  (3dbag.nl, CC BY 4.0), toggled between two render modes:

  - "roofs" (default) — real per-face LoD2.2 geometry, with outlines.
  - "buildings" (toggle) — footprint extruded to a derived height.

  Filter and legend both work in either mode.
-->
<html>
<head>
  <meta charset="utf-8" />
  <title>OnlyMapJS — CityJSON example</title>
  <script type="module" src="https://unpkg.com/@nika-js/onlymap@0.5.11/dist/onlymap.standalone.js"></script>
  <link rel="stylesheet" href="nav.css" />
</head>
<body>

  <header class="nav">
    <strong>OnlyMapJS examples</strong>
    <a href="index.html">Overview</a>
    <a href="widgets.html">Widgets</a>
    <a href="behaviors-overlays.html">Behaviors &amp; overlays</a>
    <a href="basemap.html">Basemap</a>
    <a href="columnar.html">Columnar / GeoArrow</a>
    <a href="raster.html">Raster / GeoTIFF</a>
    <a href="cityjson.html">CityJSON</a>
    <a href="draw.html">Draw</a>
    <a href="scenegraph.html">3D models</a>
    <a href="lighting.html">Scene lighting</a>
    <a href="terrain.html">Terrain</a>
    <a href="google-3d-tiles.html">Google 3D Tiles</a>
    <a href="google-3d-flyby.html">3D Flyby</a>
    <a href="ais.html">Live AIS</a>
    <a href="fleet.html">Fleet (polling)</a>
    <a href="story.html">Map story</a>
    <a href="https://github.com/NikaGeospatial/onlymapjs/blob/main/docs/react.md">React adapter</a>
  </header>

  <om-map center="[4.368337, 52.001121]" zoom="16.2" pitch="58" bearing="25"
          basemap="positron" lighting="studio">

    <om-layer id="roofs" type="SolidPolygonLayer" label="3DBAG buildings (real LoD 2.2 roofs)"
              data="./data/3dbag-tile.city.json?om-surfaces=1"
              get-polygon="$polygon" full3d
              get-fill-color="$surface_type == 'GroundSurface' ? '#5a5a5a' : $surface_type == 'WallSurface' ? '#9c9488' : $surface_type == 'RoofSurface' ? '#8b3a2f' : '#707070'"
              filter-field="roof_height" filter-range="[0, 40]"
              pickable>
    </om-layer>

    <om-layer id="roof-outlines" type="PathLayer" label="3DBAG buildings (roof edges)"
              data="./data/3dbag-tile.city.json?om-surfaces=1"
              get-path="$outline"
              get-color="[0, 0, 0]"
              width-min-pixels="1"
              filter-field="roof_height" filter-range="[0, 40]"
              pickable="false">
    </om-layer>

    <om-layer id="buildings" type="GeoJsonLayer" label="3DBAG buildings (flat extrusion)"
              data="./data/3dbag-tile.city.json"
              extruded filled stroked="false" visible="false"
              get-elevation="$roof_height"
              color="#9a9a9a"
              filter-field="roof_height" filter-range="[0, 40]"
              pickable>
    </om-layer>

    <om-widget id="roof-filter" type="filter" layer="roofs" field="roof_height" title="Roof height (m)"
               position="top-right"></om-widget>

    <om-widget type="legend" title="Layers" position="bottom-right"></om-widget>

    <om-widget position="top-left">
      <style>
        .roof-toggle button { font: 12px system-ui, sans-serif; padding: 6px 10px; border: 0; border-radius: 6px;
                               background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.25); cursor: pointer; }
      </style>
      <div class="roof-toggle"><button id="toggle-roofs">Real roofs ↔ flat extrusion</button></div>
      <script type="om/widget">
        this.watch = ["layers"];
        this.render = (ctx) => {
          this.$("#toggle-roofs").onclick = () => {
            const roofsEl = document.querySelector('om-layer[id="roofs"]');
            const buildingsEl = document.querySelector('om-layer[id="buildings"]');
            const roofsVisible = roofsEl.getAttribute("visible") !== "false";
            const [fromEl, toId, toEl] = roofsVisible ? [roofsEl, "buildings", buildingsEl] : [buildingsEl, "roofs", roofsEl];
            const currentRange = fromEl.getAttribute("filter-range");
            if (currentRange) toEl.setAttribute("filter-range", currentRange);
            document.querySelector("#roof-filter").setAttribute("layer", toId);
            ctx.emit("toggle-layer", { layer: "roofs" });
            ctx.emit("toggle-layer", { layer: "buildings" });
            ctx.emit("toggle-layer", { layer: "roof-outlines" });
          };

          const roofsMeta = ctx.layers.find((l) => l.id === "roofs");
          if (roofsMeta?.filter) {
            const outlinesEl = document.querySelector('om-layer[id="roof-outlines"]');
            outlinesEl.setAttribute("filter-field", roofsMeta.filter.field);
            outlinesEl.setAttribute("filter-range", JSON.stringify(roofsMeta.filter.range));
          }
        };
      </script>
    </om-widget>

    <om-behavior on="hover" layer="roofs" action="show-tooltip" template="#surface-tooltip"></om-behavior>
    <om-behavior on="hover" layer="buildings" action="show-tooltip" template="#building-tooltip"></om-behavior>

  </om-map>

  <template id="building-tooltip">
    <div style="background:#222; color:#fff; padding:6px 10px; border-radius:4px; font:12px system-ui, sans-serif; line-height:1.5;">
      <b>{{cityobject_type}}</b> · LoD {{lod}}<br />
      built {{oorspronkelijkbouwjaar}} · roof {{b3_dak_type}}<br />
      <span style="opacity:.75">derived</span> eaves {{eaves_height}} m · roof {{roof_height}} m · ridge {{ridge_height}} m<br />
      <span style="opacity:.75">derived</span> roof area {{roof_area}} m²<br />
      <span style="opacity:.75">3DBAG</span> h_dak_50p {{b3_h_dak_50p}} · maaiveld {{b3_h_maaiveld}}
    </div>
  </template>

  <template id="surface-tooltip">
    <div style="background:#222; color:#fff; padding:6px 10px; border-radius:4px; font:12px system-ui, sans-serif; line-height:1.5;">
      <b>{{surface_type}}</b> · {{cityobject_type}} · LoD {{lod}}<br />
      built {{oorspronkelijkbouwjaar}} · roof {{b3_dak_type}}<br />
      <span style="opacity:.75">derived (whole building)</span> eaves {{eaves_height}} m · roof {{roof_height}} m · ridge {{ridge_height}} m
    </div>
  </template>

</body>
</html>
