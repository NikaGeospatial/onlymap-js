<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Airliner planform pointing NORTH (up) — IconLayer's get-angle rotates it
       to the aircraft's track. White + mask:true so get-color tints it by
       altitude. Solid, with no cut-outs: transparent pixels inside an icon are
       unpickable, and the fuselage centre is exactly where people click. -->
